name: Sync casts from spreadsheet

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Fetch spreadsheet CSV and write JSON
        env:
          CAST_SHEET_CSV_URL: ${{ secrets.CAST_SHEET_CSV_URL }}
        run: |
          set -euo pipefail
          if [ -z "${CAST_SHEET_CSV_URL:-}" ]; then
            echo "Set repository secret CAST_SHEET_CSV_URL to the published CSV URL."
            exit 1
          fi
          curl -fsSL "$CAST_SHEET_CSV_URL" -o /tmp/casts.csv
          python3 - <<'PY'
          import csv, json, io, re, sys
          from pathlib import Path

          raw = Path("/tmp/casts.csv").read_text(encoding="utf-8-sig")
          if "<html" in raw[:500].lower():
              raise SystemExit("The secret URL returned HTML, not CSV. Publish the sheet to the web as CSV.")

          lines = [line for line in raw.splitlines() if line.strip()]
          header_idx = 0
          for i, line in enumerate(lines):
              if "名前" in line or re.search(r"(^|,|\t)name(,|\t|$)", line, re.I):
                  header_idx = i
                  break
          table = "\n".join(lines[header_idx:])
          dialect = csv.excel_tab if ("\t" in lines[header_idx] and "," not in lines[header_idx]) else csv.excel
          reader = csv.DictReader(io.StringIO(table), dialect=dialect)
          print("Headers:", reader.fieldnames)

          def norm_key(value):
              return re.sub(r"\s+", "", "" if value is None else str(value)).lower()

          def cell_text(value):
              if value is None:
                  return ""
              if isinstance(value, list):
                  return " ".join(cell_text(item) for item in value).strip()
              return str(value).strip()

          def pick(row, *keys):
              lower = {}
              for k, v in row.items():
                  key = norm_key(k)
                  text = cell_text(v)
                  if key and text:
                      lower[key] = text
              for key in keys:
                  found = lower.get(norm_key(key), "")
                  if found:
                      return found
              return ""

          def is_hidden(value):
              return value.lower() in {"0", "false", "no", "非表示", "なし", "ng"}

          def make_id(name, explicit):
              if explicit:
                  return explicit
              return name

          casts = []
          for row in reader:
              name = pick(row, "名前", "氏名", "name")
              if not name:
                  continue
              visible = pick(row, "表示", "visible", "show")
              if visible and is_hidden(visible):
                  continue
              photos = [
                  pick(row, "写真1", "photo1", "画像1"),
                  pick(row, "写真2", "photo2", "画像2"),
                  pick(row, "写真3", "photo3", "画像3"),
              ]
              casts.append({
                  "id": make_id(name, pick(row, "id", "ID")),
                  "name": name,
                  "gender": pick(row, "性別", "gender"),
                  "race": pick(row, "種族", "race"),
                  "grade": pick(row, "学年", "grade", "role"),
                  "personality": pick(row, "性格", "personality"),
                  "birthday": pick(row, "誕生日", "birthday"),
                  "color": pick(row, "イメージカラー", "color", "イメージカラーコード"),
                  "quote": pick(row, "一言", "紹介", "キャッチ", "quote", "catch"),
                  "icon": pick(row, "アイコン", "icon"),
                  "photos": [p for p in photos if p],
              })

          if not casts:
              print("No casts parsed. First 400 chars of CSV:")
              print(raw[:400])
              raise SystemExit("Parsed 0 casts. Check that row 1 has 名前 and the CSV URL is the published CSV.")

          out = Path("data/casts.json")
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(json.dumps(casts, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(f"Wrote {len(casts)} casts")
          PY

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/casts.json
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "Update cast data from spreadsheet"
            git push
          fi
